<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b4bdb">
<title>암기퀘스트</title>
<style>
:root{--bg:#faf7f0;--cd:#fff;--tx:#1d1b2e;--mu:#6b6880;--bd:#e6e1d4;--pr:#5b4bdb;--gr:#1e8f4f;--or:#d9730d;--rd:#c93c3c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14131c;--cd:#1e1c2b;--tx:#f1eff8;--mu:#a29fb8;--bd:#33304a;--pr:#8f82ff;--gr:#4cd08a;--or:#ffa24a;--rd:#ff7b7b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14131c;--cd:#1e1c2b;--tx:#f1eff8;--mu:#a29fb8;--bd:#33304a;--pr:#8f82ff;--gr:#4cd08a;--or:#ffa24a;--rd:#ff7b7b;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:0 0 8px}p{margin:4px 0}.mu{color:var(--mu)}small{color:var(--mu);font-size:13px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:0 0 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}.col{display:flex;flex-direction:column;gap:8px}
.b{min-height:46px;padding:10px 16px;border-radius:14px;border:0;background:var(--pr);color:#fff;font:600 16px inherit;cursor:pointer;width:100%}
.b.s{background:transparent;color:var(--pr);border:1.5px solid var(--bd);width:auto}.row>.b{width:auto;flex:1}.b.d{background:var(--rd)}
.b:active{transform:scale(.97)}.b:disabled{opacity:.5}
.ib{min-width:44px;min-height:44px;border:0;background:transparent;color:var(--tx);font-size:20px;cursor:pointer;border-radius:12px}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gr);border-radius:9px;transition:width .4s}
.bar.x i{background:var(--pr)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;border:1px solid var(--bd);font-size:13px;font-weight:600}
.big{font-size:30px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats b{display:block;font-size:22px}
.wk{display:flex;gap:6px;align-items:flex-end;height:90px}.wk div{flex:1;text-align:center;font-size:12px;color:var(--mu)}
.wk i{display:block;background:var(--pr);border-radius:6px 6px 0 0;min-height:3px;margin-bottom:3px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;min-height:56px;border:0;background:none;color:var(--mu);font:600 12px inherit;cursor:pointer}nav button span{display:block;font-size:20px}nav .on{color:var(--pr)}
.top{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.fl{perspective:1000px;margin:14px 0}.fi{position:relative;min-height:320px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}.fi.on{transform:rotateY(180deg)}
.fa,.fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:auto;background:var(--cd);border:1.5px solid var(--bd);border-radius:22px;padding:18px;display:flex;flex-direction:column;text-align:center}
.fb{transform:rotateY(180deg);border-color:var(--pr)}.tx{margin:auto;font-size:24px;font-weight:700;white-space:pre-wrap;word-break:break-word}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.rates button{min-height:64px;border-radius:14px;border:1.5px solid var(--bd);background:var(--cd);color:var(--tx);font:700 14px inherit;cursor:pointer}.rates small{display:block}
.r1{border-color:var(--rd)!important}.r3{border-color:var(--gr)!important}.r4{border-color:var(--pr)!important}.r2{border-color:var(--or)!important}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 0}input,textarea,select{width:100%;font:16px inherit;padding:10px;border-radius:12px;border:1.5px solid var(--bd);background:var(--bg);color:var(--tx);margin-top:4px}textarea{min-height:76px}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:9}#modal.on{display:flex}
#modal>div{background:var(--cd);width:100%;max-width:560px;margin:0 auto;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:90%;text-align:center}#toast.on{opacity:1}
.err{color:var(--rd);font-weight:600;min-height:20px}.ok{color:var(--gr)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div id="app"></div><nav id="nav"></nav><div id="modal"></div><div id="toast" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const DAY=864e5,MIN=6e4,$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const today=()=>dkey(Date.now()),sod=(t=Date.now())=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const def=()=>({v:1,decks:[],cards:[],logs:[],sess:[],claimed:{},prog:{xp:0,streak:0,longest:0,last:null,ach:{}},set:{goal:30,newPerDay:10,typing:false,rev:false}});
let S=def(),V={tab:'home',deck:null,q:''},ses=null,busy=false,cb=null,db=null;

/* ---------- 저장소 (IndexedDB) ---------- */
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('memoquest',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idb=(m,f)=>new Promise((res,rej)=>{const t=db.transaction('kv',m),o=f(t.objectStore('kv'));t.oncomplete=()=>res(o.result);t.onerror=()=>rej(t.error)});
/* ---------- 클라우드 동기화 (계정 개인 저장소, 기기 간 공유) ---------- */
let cdb=null,cuid=null,syncT=null,syncing=false,cloudOn=false;
const CH=180000;
const setSync=t=>{const e=document.getElementById('syncst');if(e)e.textContent=t};
async function cloudPush(){
 if(!cloudOn||syncing)return;syncing=true;
 try{
  const j=JSON.stringify(S),n=Math.ceil(j.length/CH)||1,col=cdb.collection('data/users/'+cuid);
  for(let i=0;i<n;i++)await col.doc('c'+i).set({p:j.slice(i*CH,(i+1)*CH)});
  await col.doc('meta').set({u:S.u,n});
  setSync('☁️ 동기화됨 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}));
 }catch(e){setSync('⚠️ 동기화 실패 (이 기기에는 저장됨)')}
 syncing=false;
}
async function cloudPull(){
 const col=cdb.collection('data/users/'+cuid),m=await col.doc('meta').get();
 if(!m.exists)return null;
 const {u,n}=m.data();let j='';
 for(let i=0;i<n;i++){const d=await col.doc('c'+i).get();if(!d.exists)return null;j+=d.data().p}
 return {u,o:JSON.parse(j)};
}
const nrm=o=>({...def(),...o,prog:{...def().prog,...o.prog},set:{...def().set,...o.set}});
async function save(){
 S.u=Date.now();
 try{await idb('readwrite',s=>s.put(JSON.parse(JSON.stringify(S)),'state'))}catch(e){if(!cloudOn){toast('⚠️ 저장 실패: 저장소를 확인하세요');return false}}
 clearTimeout(syncT);syncT=setTimeout(cloudPush,1200);
 return true;
}
async function syncDown(){
 if(!cloudOn||(typeof ses!=='undefined'&&ses&&!ses.fin))return;
 try{const r=await cloudPull();
  if(r&&r.u>(S.u||0)){S=nrm(r.o);try{await idb('readwrite',s=>s.put(JSON.parse(JSON.stringify(S)),'state'))}catch(e){}render();toast('☁️ 다른 기기의 최신 데이터를 불러왔어요')}
  else if(!r||r.u<(S.u||0))cloudPush();
  else setSync('☁️ 동기화됨');
 }catch(e){setSync('⚠️ 동기화 실패 (이 기기에는 저장됨)')}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncDown()});

/* ---------- 스케줄러 (SM-2 계열, 독립 모듈) ---------- */
const Sched={
 next(c,r,now=Date.now()){
  const n={ease:c.ease||2.5,ivl:c.ivl||0,reps:c.reps||0,lapses:c.lapses||0,state:c.state||'new'},day=d=>sod(now)+d*DAY;
  if(n.state==='review'){
   if(r===1){n.lapses++;n.ease=Math.max(1.3,n.ease-.2);n.ivl=1;n.state='learn';n.due=now+10*MIN}
   else{let i=r===2?n.ivl*1.2:r===3?n.ivl*n.ease:n.ivl*n.ease*1.3;i=Math.max(n.ivl+1,Math.round(i));
    if(r===2)n.ease=Math.max(1.3,n.ease-.15);if(r===4)n.ease+=.15;n.ivl=i;n.reps++;n.due=day(i)}
  }else{
   if(r===1)n.due=now+MIN;else if(r===2)n.due=now+5*MIN;
   else if(r===3){if(n.state==='new')n.due=now+10*MIN;else{n.ivl=Math.max(1,n.ivl);n.state='review';n.reps++;n.due=day(n.ivl)}}
   else{n.ivl=4;n.state='review';n.reps++;n.due=day(4)}
   if(n.state==='new')n.state='learn';
  }return n},
 label(n,now=Date.now()){const d=n.due-now;if(d<60*MIN)return Math.max(1,Math.round(d/MIN))+'분 후';
  const k=Math.round((n.due-sod(now))/DAY);return k<=1?'내일':k<30?k+'일 후':k<365?Math.round(k/30)+'개월 후':(k/365).toFixed(1)+'년 후'},
 isDue(c,now=Date.now()){return c.state!=='new'&&c.due<=(c.state==='review'?sod(now)+DAY-1:now)}
};

/* ---------- 게임화 ---------- */
const lvl=xp=>{let L=1;while(xp>=50*L*(L+1))L++;return L};
const QUESTS=[{id:'a',t:'카드 10개 학습하기',n:10,f:()=>true},{id:'b',t:'외국어 카드 5개 복습하기',n:5,f:l=>l.fl},{id:'c',t:'어려운 카드 3개 다시 맞히기',n:3,f:l=>l.rl}];
const logsToday=()=>S.logs.filter(l=>dkey(l.t)===today());
const qProg=q=>logsToday().filter(q.f).length;
const ACH=[{id:'first',t:'첫 카드 학습',ok:()=>S.logs.length>=1},{id:'c100',t:'카드 100개 학습',ok:()=>new Set(S.logs.map(l=>l.cid)).size>=100},{id:'s7',t:'7일 연속 학습',ok:()=>S.prog.longest>=7},{id:'fl50',t:'외국어 카드 50개 복습',ok:()=>S.logs.filter(l=>l.fl).length>=50}];
function week(){const w=[...Array(7)].map((_,i)=>{const t=Date.now()-(6-i)*DAY;return{k:dkey(t),d:'일월화수목금토'[new Date(t).getDay()]}});w.forEach(x=>x.n=S.logs.filter(l=>dkey(l.t)===x.k).length);return w}
function cnt(id){const now=Date.now(),cs=S.cards.filter(c=>!id||c.deckId===id);
 const nd=S.logs.filter(l=>l.nw&&dkey(l.t)===today()&&(!id||l.dk===id)).length;
 return{tot:cs.length,due:cs.filter(c=>Sched.isDue(c,now)).length,nw:Math.min(cs.filter(c=>c.state==='new').length,Math.max(0,S.set.newPerDay-nd))}}
const card=id=>S.cards.find(c=>c.id===id),deck=id=>S.decks.find(d=>d.id===id);
const mk=(deckId,o)=>({id:uid(),deckId,type:'basic',front:'',back:'',lang:'',pron:'',ex:'',created:Date.now(),due:0,ivl:0,ease:2.5,reps:0,lapses:0,state:'new',...o});

/* ---------- 학습 세션 ---------- */
function build(id){const now=Date.now(),cs=S.cards.filter(c=>!id||c.deckId===id);
 const due=cs.filter(c=>Sched.isDue(c,now)).sort((a,b)=>a.due-b.due);
 return[...due,...cs.filter(c=>c.state==='new').slice(0,cnt(id).nw)].map(c=>c.id)}
function startSes(id){const q=build(id);if(!q.length)return toast('지금 학습할 카드가 없어요');
 ses={q,id,name:id?deck(id).name:'전체 학습',t0:Date.now(),done:0,good:0,hard:0,xp:0,show:false,ts:Date.now(),fin:false};V.tab='ses';render()}
async function rate(r){
 if(busy||!ses||!ses.show||ses.fin)return;busy=true;
 const c=card(ses.q[0]),now=Date.now(),n=Sched.next(c,r,now),old={...c},oldP=JSON.parse(JSON.stringify(S.prog)),oldC={...S.claimed},nL=S.logs.length;
 const rl=c.state==='learn'&&c.lapses>0&&r>=3,xp=r>=2?10+(rl?2:0):0,L0=lvl(S.prog.xp),P=S.prog,td=today();
 Object.assign(c,n,{last:now});
 S.logs.push({id:uid(),cid:c.id,dk:c.deckId,t:now,r,nw:old.state==='new',fl:c.type==='foreign',rl,prev:old.due,next:n.due,ms:now-ses.ts});
 P.xp+=xp;
 if(P.last!==td){P.streak=P.last===dkey(Date.now()-DAY)?P.streak+1:1;P.last=td;P.longest=Math.max(P.longest,P.streak)}
 const msgs=[];
 QUESTS.forEach(q=>{const k=td+q.id;if(qProg(q)>=q.n&&!S.claimed[k]){S.claimed[k]=1;P.xp+=20;msgs.push('퀘스트 완료! +20 XP')}});
 ACH.forEach(a=>{if(!P.ach[a.id]&&a.ok()){P.ach[a.id]=td;msgs.push('🏅 '+a.t)}});
 if(lvl(P.xp)>L0)msgs.unshift('🎉 레벨 업! Lv.'+lvl(P.xp));
 if(await save()){ses.q.shift();if(n.due-now<20*MIN)ses.q.push(c.id);ses.done++;ses.xp+=xp;r>=3?ses.good++:ses.hard++;
  toast(msgs.join(' · ')||(xp?'+'+xp+' XP':'다시 볼게요'));
  if(!ses.q.length)endSes();else{ses.show=false;ses.ts=Date.now()}render()}
 else{Object.assign(c,old);S.logs.length=nL;S.prog=oldP;S.claimed=oldC}
 busy=false}
async function endSes(){if(ses.fin)return;ses.fin=true;if(ses.done){S.sess.push({t:ses.t0,n:ses.done,ms:Date.now()-ses.t0});await save()}}
async function exitSes(){await endSes();ses=null;V.tab='home';render()}

/* ---------- 화면 ---------- */
const expect=c=>c.type==='cloze'?[...c.front.matchAll(/\{\{(.+?)\}\}/g)].map(m=>m[1]).join(', '):(c.type==='foreign'&&S.set.rev)?c.front:c.back;
const norm=s=>String(s).toLowerCase().replace(/[.,!?;:'"“”‘’]/g,'').replace(/\s+/g,' ').trim();
function faces(c){const e=esc;
 if(c.type==='foreign'&&S.set.rev)return[e(c.back),e(c.front)+(c.pron?`<div class=mu style="font-size:16px">[${e(c.pron)}]</div>`:'')+(c.ex?`<div class=mu style="font-size:16px;font-weight:400">${e(c.ex)}</div>`:'')];
 if(c.type==='foreign')return[e(c.front)+(c.pron?`<div class=mu style="font-size:16px">[${e(c.pron)}]</div>`:''),e(c.back)+(c.ex?`<div class=mu style="font-size:16px;font-weight:400">${e(c.ex)}</div>`:'')];
 if(c.type==='cloze')return[e(c.front).replace(/\{\{(.+?)\}\}/g,'[ … ]'),e(c.front).replace(/\{\{(.+?)\}\}/g,'<u style="color:var(--gr)">$1</u>')+(c.back?`<div class=mu style="font-size:16px;font-weight:400">${e(c.back)}</div>`:'')];
 return[e(c.front),e(c.back)]}
const head=()=>{const p=S.prog,L=lvl(p.xp),a=50*(L-1)*L,b=50*L*(L+1);
 return`<div class=c><div class=row><span class=big>🦊</span><div class=grow><b>Lv.${L}</b> <span class=tag>⭐ ${p.xp} XP</span> <span class=tag style="color:var(--or)">🔥 ${p.streak}일</span>
 <div class="bar x" style="margin-top:6px"><i style="width:${(p.xp-a)/(b-a)*100}%"></i></div><small>다음 레벨까지 ${b-p.xp} XP</small></div></div></div>`};
function vHome(){const c=cnt(),dn=logsToday().length,g=S.set.goal,pct=Math.min(100,Math.round(dn/g*100)),w=week(),mx=Math.max(1,...w.map(x=>x.n));
 if(!S.decks.length)return`<h1>암기퀘스트</h1>${head()}<div class=c><h2>시작해 볼까요?</h2><p class=mu>샘플 덱은 선택했을 때만 추가돼요.</p><div class=col>
 <button class=b data-a=sample data-id=en>🌍 외국어 단어장 (영어 샘플)</button><button class=b data-a=sample data-id=gk>💡 일반 상식 (샘플)</button><button class=b data-a=fileImp>📥 파일/메모로 한 번에 만들기</button><button class="b s" data-a=newDeck>✏️ 직접 만드는 나만의 덱</button></div></div>`;
 return`<h1>오늘의 미션</h1>${head()}<div class=c><h2>오늘의 학습</h2><div class=stats><div><b>${c.due}</b>복습</div><div><b>${c.nw}</b>새 카드</div><div><b>${dn}/${g}</b>목표</div></div>
 <div class=bar style="margin:12px 0"><i style="width:${pct}%"></i></div><p class=mu>달성률 ${pct}%</p><button class=b data-a=start ${c.due+c.nw?'':'disabled'}>▶ ${c.due+c.nw?'학습 시작':'오늘 학습 끝!'}</button></div>
 <div class=c><h2>일일 퀘스트</h2>${QUESTS.map(q=>{const n=Math.min(q.n,qProg(q));return`<div style="margin:8px 0"><div class=row><span class=grow>${q.t}</span><b class="${n>=q.n?'ok':''}">${n>=q.n?'✓ 완료':n+'/'+q.n}</b></div><div class=bar><i style="width:${n/q.n*100}%"></i></div></div>`}).join('')}<small>완료 시 +20 XP (하루 한 번)</small></div>
 <div class=c><h2>최근 7일</h2><div class=wk>${w.map(x=>`<div><i style="height:${x.n/mx*60}px"></i>${x.n}<br>${x.d}</div>`).join('')}</div>
 <p class=mu>이번 주 학습일 ${w.filter(x=>x.n).length}일 · 카드 ${w.reduce((s,x)=>s+x.n,0)}회</p></div>`}
function vStudy(){return`<h1>학습</h1>${!S.decks.length?'<div class=c>먼저 덱을 만들어 주세요.</div>':`<button class=b data-a=start style="margin-bottom:12px">▶ 전체 학습 (복습 ${cnt().due} · 새 카드 ${cnt().nw})</button>`+S.decks.map(d=>{const c=cnt(d.id);return`<div class=c><div class=row><div class=grow><b>${esc(d.name)}</b><br><small>복습 ${c.due} · 새 카드 ${c.nw}</small></div><button class="b s" data-a=start data-id="${d.id}">학습</button></div></div>`}).join('')}`}
const deckRows=()=>S.decks.filter(d=>d.name.toLowerCase().includes(V.q.toLowerCase())).sort((a,b)=>(b.fav||0)-(a.fav||0)).map(d=>{const c=cnt(d.id);
 return`<div class=c><div class=row><button class=ib data-a=fav data-id="${d.id}" aria-label="즐겨찾기">${d.fav?'★':'☆'}</button><div class=grow data-a=open data-id="${d.id}" style="cursor:pointer"><b>${esc(d.name)}</b><br><small>카드 ${c.tot} · 복습 ${c.due} · 새 ${c.nw}</small></div><button class="b s" data-a=open data-id="${d.id}">열기</button></div></div>`}).join('')||'<p class=mu>덱이 없어요.</p>';

let P=[];
const Q='\u0022',hasK=s=>/[가-힣]/.test(s),TN={basic:'기본',foreign:'외국어',cloze:'빈칸'};
const csvSplit=l=>{const o=[];let c='',q=0;for(let i=0;i<l.length;i++){const h=l[i];if(q){if(h===Q&&l[i+1]===Q){c+=Q;i++}else if(h===Q)q=0;else c+=h}else if(h===Q)q=1;else if(h===','){o.push(c);c=''}else c+=h}o.push(c);return o};
const DL={tab:'\t',bar:'|',dash:' - ',eq:'=',colon:' : ',comma:',',c2:':'},ONE=['dash','eq','colon','c2'];
function rowsFrom(txt,mode){const L=txt.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);let m=mode;
 if(m==='auto'){m='alt';for(const k of ['tab','bar','dash','eq','colon','comma','c2'])if(L.filter(l=>l.includes(DL[k])).length>=Math.max(1,L.length*.6)){m=k;break}}
 if(m==='alt'){const r=[];for(let i=0;i<L.length;i+=2)r.push([L[i],L[i+1]||'']);return r}
 return L.map(l=>{if(m==='comma')return csvSplit(l);if(ONE.includes(m)){const i=l.indexOf(DL[m]);return i<0?[l,'']:[l.slice(0,i),l.slice(i+DL[m].length)]}return l.split(DL[m])})}
function fileImp(){const did=V.deck;modal(`<h2>파일·메모로 덱 만들기</h2><p class=mu>메모장(.txt), 엑셀(.xlsx/.csv), 한글(.hwpx)을 올리거나 붙여넣으세요. 한 줄에 '앞면 - 뒷면' 또는 엑셀 1열=앞면, 2열=뜻, 3열=발음, 4열=예문으로 인식해요.</p>
 <label>파일 선택<input type=file id=fil accept='.txt,.csv,.tsv,.md,.xlsx,.xls,.hwpx,.hwp'></label>
 <label>또는 붙여넣기<textarea id=fi-x style='min-height:110px' placeholder='apple - 사과&#10;library - 도서관'></textarea></label>
 <div class=row><label class=grow>구분 방식<select id=fi-m><option value=auto>자동 인식</option><option value=tab>탭 (엑셀)</option><option value=comma>쉼표 (CSV)</option><option value=dash>' - '</option><option value=eq>=</option><option value=colon>' : '</option><option value=c2>:</option><option value=bar>|</option><option value=alt>두 줄씩 (앞면/뒷면)</option></select></label>
 <label class=grow>카드 유형<select id=fi-t><option value=auto>자동</option><option value=basic>기본</option><option value=foreign>외국어</option><option value=cloze>빈칸</option></select></label></div>
 <label><input type=checkbox id=fi-h style='width:auto;margin-right:8px'>첫 줄은 제목이라 건너뛰기</label>
 <label>언어 코드 (외국어, 비우면 자동)<input id=fi-l placeholder='en-US'></label>
 <label>추가할 덱<select id=fi-d><option value=new>＋ 새 덱 만들기</option>${S.decks.map(d=>`<option value='${d.id}' ${d.id===did?'selected':''}>${esc(d.name)}</option>`).join('')}</select></label>
 <label>새 덱 이름<input id=fi-n></label><div id=fi-p></div><p class=err id=err></p>
 <div class=row><button class='b s' data-a=close>닫기</button><button class='b s' data-a=fiParse>분석</button><button class=b id=fi-go data-a=fiGo disabled>덱에 추가</button></div>`);P=[]}
function fiParse(){const mode=$('#fi-m').value,tp=$('#fi-t').value,lg=$('#fi-l').value.trim(),d=$('#fi-d').value,hd=$('#fi-h').checked;
 let rows=rowsFrom($('#fi-x').value,mode).map(r=>r.map(c=>String(c??'').trim()));if(hd)rows=rows.slice(1);
 const seen=new Set(d==='new'?[]:S.cards.filter(c=>c.deckId===d).map(c=>norm(c.front))),ok=[],bad=[];let dup=0;
 rows.forEach((r,i)=>{if(!r.some(Boolean))return;const[a='',b='',p='',e='']=r,cl=/\{\{.+?\}\}/.test(a);
  const t=tp==='auto'?(cl?'cloze':(a&&!hasK(a)&&(hasK(b)||r.length>=3))?'foreign':'basic'):tp;
  if(!a||(t!=='cloze'&&!b)||(t==='cloze'&&!cl)){bad.push({i:i+1+(hd?1:0),r});return}
  const k=norm(a);if(seen.has(k)){dup++;return}seen.add(k);
  ok.push({type:t,front:a,back:b,pron:t==='foreign'?p:'',ex:t==='foreign'?e:'',lang:t==='foreign'?(lg||(/[\u3040-\u30ff]/.test(a)?'ja-JP':/[\u4e00-\u9fff]/.test(a)?'zh-CN':'en-US')):''})});
 P=ok;$('#err').textContent=ok.length||bad.length?'':'인식된 내용이 없어요. 구분 방식을 바꿔 보세요';
 $('#fi-p').innerHTML=`<div class=c style='margin-top:10px'><b>${ok.length}장 인식</b>${dup?` · 중복 ${dup}개 제외`:''}${bad.length?` · <span style='color:var(--rd)'>확인 필요 ${bad.length}줄</span>`:''}<br>${ok.slice(0,5).map(o=>`<small>${TN[o.type]}</small> ${esc(o.front)} → ${esc(o.back)}<br>`).join('')}${bad.slice(0,3).map(b=>`<small style='color:var(--rd)'>${b.i}번째 줄: ${esc(b.r.join(' | ').slice(0,40))}</small><br>`).join('')}</div>`;
 $('#fi-go').disabled=!ok.length}
async function fiGo(){if(!P.length)return;let id=$('#fi-d').value;const n0=S.cards.length,d0=S.decks.length;
 if(id==='new'){const n=$('#fi-n').value.trim();if(!n)return $('#err').textContent='새 덱 이름을 입력하세요';id=uid();S.decks.push({id,name:n,description:'가져온 덱',fav:0,created:Date.now()})}
 P.forEach(o=>S.cards.push(mk(id,o)));
 if(await save()){toast('카드 '+P.length+'장을 추가했어요');close();V.deck=id;V.tab='decks';render()}else{S.cards.length=n0;S.decks.length=d0}}
Object.assign(A,{fileImp,fiParse,fiGo});
document.addEventListener('change',async e=>{if(e.target.id!=='fil')return;const f=e.target.files[0];if(!f)return;const n=f.name.toLowerCase(),er=$('#err');er.textContent='';
 try{let t='';
  if(/\.xlsx?$/.test(n)){if(typeof XLSX==='undefined')throw Error('엑셀 처리 도구를 불러오지 못했어요. 인터넷 연결을 확인하거나 CSV로 저장해 올려주세요');
   const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});t=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}).map(r=>r.map(c=>String(c).replace(/[\t\r\n]+/g,' ').trim()).join('\t').replace(/\t+$/,'')).join('\n')}
  else if(n.endsWith('.hwpx')){if(typeof JSZip==='undefined')throw Error('압축 해제 도구를 불러오지 못했어요. 인터넷 연결을 확인하세요');
   const z=await JSZip.loadAsync(await f.arrayBuffer()),o=[];
   for(const k of Object.keys(z.files).filter(k=>/Contents\/section\d+\.xml$/.test(k)).sort()){const d=new DOMParser().parseFromString(await z.files[k].async('string'),'text/xml');
    for(const p of d.getElementsByTagName('hp:p')){if(p.getElementsByTagName('hp:p').length)continue;const s=Array.from(p.getElementsByTagName('hp:t')).map(q=>q.textContent).join('').trim();if(s)o.push(s)}}
   t=o.join('\n')}
  else if(n.endsWith('.hwp'))throw Error('구형 .hwp 파일은 직접 읽을 수 없어요. 한글에서 다른 이름으로 저장 → HWPX 또는 텍스트(.txt)로 저장하거나, 내용을 복사해 붙여넣어 주세요');
  else{const buf=await f.arrayBuffer();t=new TextDecoder('utf-8').decode(buf);if(t.includes('\ufffd'))t=new TextDecoder('euc-kr').decode(buf)}
  if(!t.trim())throw Error('읽을 수 있는 내용이 없어요');
  $('#fi-x').value=t;$('#fi-h').checked=/^(단어|word|앞면|front|질문|question|영어|english|번호)/i.test(t.trim());
  const nn=$('#fi-n');if(!nn.value)nn.value=f.name.replace(/\.[^.]+$/,'');fiParse();toast('파일을 읽었어요')}
 catch(ex){er.textContent=ex.message}});

/* ---------- 시작 ---------- */
(async()=>{
 let localOk=true;
 try{db=await open();const o=await idb('readonly',s=>s.get('state'));if(o)S=nrm(o)}catch(e){localOk=false}
 render();
 try{
  const c=window.claude&&await window.claude.use('db'),us=window.claude&&await window.claude.use('user');
  if(c&&us){cuid=await us.id();if(cuid){cdb=c;cloudOn=true;await syncDown();return}}
 }catch(e){}
 if(!localOk)toast('⚠️ 저장소를 사용할 수 없어요. 기록이 유지되지 않을 수 있어요');
})();
</script></body></html>
